name: Games sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r games/requirements.txt
      - run: python games/sync_games.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
          GAMES_DATABASE_ID: ${{ secrets.GAMES_DATABASE_ID }}
