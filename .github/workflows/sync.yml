name: Sync AniList Notion

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python sync.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DATABASE_ID: ${{ secrets.DATABASE_ID }}
          ANILIST_TOKEN: ${{ secrets.ANILIST_TOKEN }}
          ANILIST_USERNAME: ${{ secrets.ANILIST_USERNAME }}
          DEDUPE_ARCHIVE: ${{ vars.DEDUPE_ARCHIVE }}
          LOOP_SECONDS: "60"
          MAX_RUNTIME_SECONDS: "270"
